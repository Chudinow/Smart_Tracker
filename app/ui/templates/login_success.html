<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Work Life Balance — Добро пожаловать</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="wlb-auth-body">
<div class="wlb-auth-shell">
    <div class="wlb-auth-inner">
        <div class="wlb-auth-panel">
            <div class="wlb-auth-panel-title">
                Привет, {{ user.display_name or user.username }} 👋
            </div>
            <div class="wlb-auth-panel-sub">
                Вы успешно вошли в систему. Здесь позже будет твой дашборд.
            </div>
            <a href="/login" class="wlb-auth-submit" style="display:inline-block; text-align:center; margin-top:1rem;">
                Выйти
            </a>
        </div>

        <div class="wlb-auth-hero-wrapper">
            <img src="https://i.ibb.co/wrw0Qngb/work-life-balance-main.png"
                 alt="Work Life Balance">
        </div>
    </div>
</div>
</body>
</html>
